<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="utf-8"><title>Sinh vien</title></head><body><h1>Danh sach sinh vien</h1><a href="/students/create" sec:authorize="hasRole('ADMIN')">THEM</a><form method="get"><input name="q"><button>Tim</button></form><table><tr th:each="s : ${students}"><td th:text="${s.studentCode}"></td><td th:text="${s.fullName}"></td><td th:text="${s.email}"></td><td sec:authorize="hasRole('ADMIN')"><a th:href="@{/students/edit/{id}(id=${s.id})}">Sua</a><form th:action="@{/students/delete/{id}(id=${s.id})}" method="post"><button>Xoa</button></form></td></tr></table><form th:action="@{/logout}" method="post" sec:authorize="hasRole('ADMIN')"><button>Dang xuat</button></form></body></html>
