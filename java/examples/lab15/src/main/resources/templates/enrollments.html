<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Dang ky hoc phan</title></head><body><h1>Dang ky hoc phan</h1><p th:text="${message}"></p><form th:action="@{/enrollments}" method="post"><select name="studentId"><option th:each="s:${students}" th:value="${s.id}" th:text="${s.fullName}"></option></select><select name="courseId"><option th:each="c:${courses}" th:value="${c.id}" th:text="${c.courseName}"></option></select><button>Dang ky</button></form><table><tr th:each="e:${records}"><td th:text="${e.student.fullName}"></td><td th:text="${e.course.courseName}"></td><td th:text="${e.enrollDate}"></td></tr></table></body></html>
