<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"><h:head><title>HoangTN Faces</title></h:head><h:body><h1>Faces student form</h1><h:messages/><h:form id="f"><h:inputText id="code" value="#{studentBean.code}" required="true"/><h:message for="code"/><h:inputText id="name" value="#{studentBean.name}" required="true"/><h:message for="name"/><h:inputText id="email" value="#{studentBean.email}" required="true"/><h:message for="email"/><h:commandButton id="save" value="Save" action="#{studentBean.save}"/></h:form><h:dataTable value="#{studentBean.students}" var="s"><h:column>#{s.code}</h:column><h:column>#{s.name}</h:column></h:dataTable></h:body></html>
