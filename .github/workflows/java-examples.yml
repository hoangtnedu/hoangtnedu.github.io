name: Java examples CI
on:
  push:
    branches: [main]
    paths: ['java/examples/**', 'tools/*java*.py', '.github/workflows/java-examples.yml']
  pull_request:
    paths: ['java/examples/**', 'tools/*java*.py', '.github/workflows/java-examples.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: java-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labs:
    name: All 16 labs / JDK ${{ matrix.java }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: java_labs
          MYSQL_USER: lab
          MYSQL_PASSWORD: lab-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u lab -plab-ci-only --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/java_labs?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: lab
      DB_PASSWORD: lab-ci-only
      LAB_DEMO_PASSWORD: ci-only-demo-password
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Show tool versions
        run: |
          java -version
          javac -version
          mvn -version
      - name: Build and test all labs with MySQL and virtual display
        run: xvfb-run -a mvn --batch-mode --no-transfer-progress --fail-at-end -f java/examples/pom.xml clean verify
      - name: Run packaged Console and Spring JARs
        run: |
          python3 tools/smoke_java.py
          python3 tools/java_suite_smoke.py
      - name: Collect per-lab test results
        if: always()
        run: python3 tools/java_test_report.py
      - name: Save packages and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: java-labs-jdk-${{ matrix.java }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            java/examples/**/target/*.jar
            java/examples/**/target/*.war
            java/examples/**/target/surefire-reports/
            java/examples/**/target/failsafe-reports/
            java/examples/**/target/*report.json
            java/ci-report.json
            !java/examples/**/target/original-*.jar

